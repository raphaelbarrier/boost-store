<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boostly — Commande</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html">BOOST<b>LY</b> ✦</a><nav><a href="index.html">Accueil</a><a href="about.html">Infos</a></nav></header><main class="form"><div class="summary"><span>RÉCAPITULATIF · <span id="label">14 boosts</span></span><span id="price">1,40 €</span></div><h2>Étape 1 sur 3 · Informations</h2><div class="steps"><span class="active">1. Coordonnées</span><span>2. Crypto</span><span>3. Confirmation</span></div><div class="panel"><label class="field" for="email">Adresse e-mail</label><input type="email" id="email" placeholder="vous@exemple.fr" required><label class="field" for="discord">Identifiant Discord (facultatif)</label><input type="text" id="discord" placeholder="Votre identifiant"><label class="field" for="promo">Code promotionnel (facultatif)</label><input type="text" id="promo" placeholder="Code"><div class="note">🧪 Ce site est une maquette : aucun paiement crypto réel n'est activé et aucune commande n'est livrée.</div><button class="btn" style="width:100%" id="next">Continuer →</button></div><a class="back" href="index.html">← Retour aux offres</a></main><footer>Boostly · Démonstration</footer><script>const plan=new URLSearchParams(location.search).get('plan')==='28'?'28':'14';document.getElementById('label').textContent=plan+' boosts';document.getElementById('price').textContent=plan==='28'?'2,80 €':'1,40 €';document.getElementById('next').onclick=()=>{const email=document.getElementById('email');if(!email.checkValidity()||!email.value){email.reportValidity();return}sessionStorage.setItem('boostlyOrder',JSON.stringify({plan,email:email.value,discord:document.getElementById('discord').value}));location.href='payment.html'};</script></body></html>
