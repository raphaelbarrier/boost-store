<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
<title id="title">Yougata — Y argenté</title><desc id="desc">Grand Y anguleux à trois branches, métal argenté biseauté, fidèle au symbole de référence.</desc>
<defs>
<linearGradient id="silver" x1="0" y1="0" x2=".75" y2="1"><stop stop-color="#f1f5f6"/><stop offset=".4" stop-color="#c6d4dd"/><stop offset="1" stop-color="#8199a9"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#879eac"/><stop offset="1" stop-color="#3c586b"/></linearGradient>
<linearGradient id="right" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9e5ec"/><stop offset="1" stop-color="#8da6b6"/></linearGradient>
</defs>
<!-- Exact three-armed Y silhouette: wide straight wings and two narrow stem facets -->
<path d="M12 49 75 46 120 101 165 46 228 49 141 148 141 202 120 229 99 202 99 148Z" fill="#304a5d" opacity=".35" transform="translate(2 4)"/>
<!-- left wing -->
<path d="M12 49 75 46 115 99 100 121Z" fill="url(#silver)" stroke="#e9f0f4" stroke-width="1.4" stroke-linejoin="round"/>
<path d="M12 49 100 121 99 148 12 49Z" fill="url(#edge)"/>
<path d="M75 46 120 101 120 129 100 148 100 121 115 99Z" fill="#a4bac8"/>
<!-- right wing, deliberately separated from left at upper fork -->
<path d="M228 49 165 46 125 99 140 121Z" fill="url(#right)" stroke="#f0f5f7" stroke-width="1.4" stroke-linejoin="round"/>
<path d="M228 49 140 121 141 148Z" fill="#617e90"/>
<path d="M165 46 120 101 120 129 140 148 140 121 125 99Z" fill="#bed0db"/>
<!-- straight central leg with pronounced metallic split -->
<path d="M100 148 120 129 120 229 99 202 99 148Z" fill="url(#silver)" stroke="#e7f0f4" stroke-width="1"/>
<path d="M120 129 140 148 141 202 120 229Z" fill="url(#edge)" stroke="#91aaba" stroke-width="1"/>
<path d="M100 148 120 129 140 148 120 168Z" fill="#e2ecf1"/>
<path d="M120 168 120 229" stroke="#f1f7f9" stroke-width="1.2" opacity=".85"/>
</svg>
